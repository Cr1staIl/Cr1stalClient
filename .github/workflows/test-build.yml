name: Test build (Windows installer)

# Quick Windows-only build for testing: produces Cr1stalClient-Setup.exe as a downloadable artifact.
# Nothing is published, the file is only visible on the run page.

on:
  push:
    branches-ignore:
      - gh-pages
      - gh-readonly-queue/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2

    - name: Build
      run: |
        mkdir release
        cd release
        cmake -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON -DINFORM_UPDATE=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target package_default

    - name: Unpack package
      shell: bash
      run: |
        cd release
        ZIP=$(ls *-win64.zip | head -n 1)
        7z x "$ZIP" -ounpacked > /dev/null
        DIR=$(ls -d unpacked/*/ | head -n 1)
        echo "PACKAGE_DIR=$(cygpath -w "$PWD/$DIR")" >> "$GITHUB_ENV"

    - name: Build installer
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=0.0.${{ github.run_number }}-test" "/DSourceDir=$env:PACKAGE_DIR" other\installer\cr1stalclient.iss

    - name: Upload installer
      uses: actions/upload-artifact@v6
      with:
        name: Cr1stalClient-Setup
        path: installer-out/Cr1stalClient-Setup.exe
        archive: false
