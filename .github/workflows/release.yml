name: Release

# Builds the Windows client, wraps it into Cr1stalClient-Setup.exe and publishes a GitHub release.
# Start it from the Actions tab ("Release" -> "Run workflow") or by pushing a tag like v1.0.0.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number (for example 1.0.0)
        required: true
        default: 1.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Version
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          V="${GITHUB_REF_NAME#v}"
        else
          V="${{ github.event.inputs.version }}"
        fi
        echo "version=$V" >> "$GITHUB_OUTPUT"

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2

    - name: Build release
      run: |
        mkdir release
        cd release
        cmake -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON -DINFORM_UPDATE=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target package_default

    - name: Unpack package
      shell: bash
      run: |
        cd release
        ZIP=$(ls *-win64.zip | head -n 1)
        7z x "$ZIP" -ounpacked > /dev/null
        DIR=$(ls -d unpacked/*/ | head -n 1)
        echo "PACKAGE_DIR=$(cygpath -w "$PWD/$DIR")" >> "$GITHUB_ENV"
        cp "$ZIP" ../Cr1stalClient-portable-win64.zip

    - name: Build installer
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$env:PACKAGE_DIR" other\installer\cr1stalclient.iss

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Cr♱stal Client ${{ steps.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        files: |
          installer-out/Cr1stalClient-Setup.exe
          Cr1stalClient-portable-win64.zip
